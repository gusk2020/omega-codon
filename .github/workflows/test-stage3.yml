name: Stage 3.0 tests
on:
  push:
    branches: [dev/stage3.0]
    paths: ['stage3.0/**', '.github/workflows/test-stage3.yml']
  pull_request:
    paths: ['stage3.0/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Runtime files must not refer to private notes
        working-directory: stage3.0
        run: |
          if grep -nE "DESIGN_LEDGER|COEXISTENCE_STUDY|ENGINE_SURVEY|STAGE2_0_DESIGN|STAGE3_0_DESIGN" index.html app.js game.js engine19.js style.css timemodel.js habitat.js earthhistory.js adaptation.js background.js rank.js civilization.js catastrophe.js world.js niche.js offworld.js; then echo "private reference found"; exit 1; fi
      - name: New parts (Stage 3.0)
        working-directory: stage3.0
        run: node test30.js
      - name: Stage 2.0 parts, against this code
        working-directory: stage3.0
        run: node test20b.js
      - name: Stage 1.9D suite, against this code (legacy saves and bit-identity)
        working-directory: stage3.0
        run: node test20.js
