name: Stage 4.1 tests (audit)
on:
  push:
    branches: [dev/audit4.0]
    paths: ['stage4.1/**', '.github/workflows/test-stage4_1.yml']
  pull_request:
    paths: ['stage4.1/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Runtime files must not refer to private notes
        working-directory: stage4.1
        run: |
          if grep -nE "DESIGN_LEDGER|COEXISTENCE_STUDY|ENGINE_SURVEY|STAGE2_0_DESIGN|STAGE3_0_DESIGN|STAGE4_0_DESIGN|STAGE4_1_AUDIT" index.html app.js game.js engine19.js style.css fmt.js history4.js dish.js codex4.js timemodel.js habitat.js earthhistory.js adaptation.js background.js rank.js civilization.js catastrophe.js world.js niche.js offworld.js; then echo "private reference found"; exit 1; fi
      - name: Audit tests (Stage 4.1)
        working-directory: stage4.1
        run: node test41.js
      - name: Stage 4.0 parts, against this code
        working-directory: stage4.1
        run: node test40.js
      - name: Stage 3.1 parts, against this code
        working-directory: stage4.1
        run: node test31.js
      - name: Stage 3.0 parts, against this code
        working-directory: stage4.1
        run: node test30.js
      - name: Stage 2.0 parts, against this code
        working-directory: stage4.1
        run: node test20b.js
      - name: Stage 1.9D suite, against this code
        working-directory: stage4.1
        run: node test20.js
