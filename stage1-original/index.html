<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>オメガ・コドン｜Stage 1 進化実験</title><style>
:root{color-scheme:dark;background:#0e1620;color:#eef4f5;font-family:system-ui,-apple-system,sans-serif}body{margin:0;padding:18px;max-width:850px;margin:auto}h1{font-size:1.42rem}h2{font-size:1.08rem}.muted{color:#9eb1bd;font-size:.87rem}.panel{background:#172431;border:1px solid #2b4251;border-radius:12px;padding:14px;margin:12px 0}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}label{font-size:.87rem}input{width:100%;box-sizing:border-box;font:inherit;margin-top:4px;background:#0e1821;border:1px solid #456070;color:white;border-radius:6px;padding:9px}input[type=checkbox]{width:auto}button{padding:12px 18px;background:#70d3bc;color:#092820;border:0;border-radius:8px;font-weight:700;font-size:1rem;cursor:pointer;width:100%}button:disabled{opacity:.5}canvas{width:100%;height:190px;background:#101c27;border-radius:7px}#stats{line-height:1.7}.footer{font-size:.78rem;color:#9eb1bd}a{color:#9bdddc}@media(max-width:400px){body{padding:10px}.fields{gap:8px}}
</style></head><body><h1>Ω オメガ・コドン</h1><p class="muted">Stage 1 ｜ 遺伝子ブロックの変異と自然選択を観察する実験版</p><section class="panel"><div class="fields"><label>乱数シード<input id="seed" type="number" value="42"></label><label>個体数<input id="population" type="number" min="10" max="1000" value="100"></label><label>世代数<input id="generations" type="number" min="1" max="10000" value="1000"></label><label>変異率（0〜1）<input id="mutationRate" type="number" min="0" max="1" step="0.01" value="0.24"></label></div><p><label><input id="changing" type="checkbox" checked> 環境を4段階で変更</label></p><p><label><input id="interactions" type="checkbox" checked> 遺伝子の隣接相互作用を有効化</label></p><button id="run">進化実験を実行</button><p class="muted" id="status">実験前</p></section><section class="panel"><h2>生存適応度の変化</h2><canvas id="fitness" width="780" height="190"></canvas><h2>ゲノム長の変化</h2><canvas id="length" width="780" height="190"></canvas><h2>集団の遺伝型多様性</h2><canvas id="diversity" width="780" height="190"></canvas></section><section class="panel"><h2>最終結果</h2><div id="stats">まだ実験していません。</div><button id="download" disabled>CSV結果を保存</button></section><p class="footer">研究用の簡略化モデルです。実在動物のDNAや免疫を予測するものではありません。計算は端末内のみで実行します。</p><script src="engine.js"></script><script>
'use strict';let result=null;const $=id=>document.getElementById(id);function plot(id,history,key,color,maxOverride){const canvas=$(id),c=canvas.getContext('2d'),w=canvas.width,h=canvas.height;c.clearRect(0,0,w,h);let values=history.map(p=>p[key]),min=0,max=maxOverride??Math.max(...values,0.01)*1.08;if(max<=min)max=min+1;c.strokeStyle='#3c5361';c.lineWidth=1;c.beginPath();for(let j=0;j<5;j++){const y=12+(h-30)*j/4;c.moveTo(40,y);c.lineTo(w-10,y);}c.stroke();c.strokeStyle=color;c.lineWidth=2.5;c.beginPath();values.forEach((v,i)=>{const x=40+(w-55)*i/Math.max(1,values.length-1),y=h-18-(h-32)*(v-min)/(max-min);i?c.lineTo(x,y):c.moveTo(x,y)});c.stroke();c.fillStyle='#b6c7cf';c.font='12px sans-serif';c.fillText(max.toFixed(2),3,18);c.fillText('0',23,h-17);c.fillText(String(history[0].generation),42,h-3);c.fillText(String(history[history.length-1].generation),w-65,h-3)}
$('run').onclick=()=>{const button=$('run');button.disabled=true;$('status').textContent='計算中…';setTimeout(()=>{try{result=OmegaEngine.simulate({seed:+$('seed').value,population:+$('population').value,generations:+$('generations').value,mutationRate:+$('mutationRate').value,changing:$('changing').checked,interactions:$('interactions').checked});const h=result.history;plot('fitness',h,'meanFitness','#70d3bc',1);plot('length',h,'meanGenome','#e7b777');plot('diversity',h,'diversity','#ab9eed',1);const first=h[0],last=h[h.length-1];$('stats').textContent=`適応度：${first.meanFitness.toFixed(3)} → ${last.meanFitness.toFixed(3)} ／ 平均ゲノム長：${first.meanGenome.toFixed(1)} → ${last.meanGenome.toFixed(1)} ／ 遺伝型多様性：${last.diversity.toFixed(3)} ／ 最終環境：${last.environment}`;$('status').textContent=`完了：${result.options.generations}世代・${result.options.population}個体。条件を変更して比較できます。`;$('download').disabled=false;}catch(e){$('status').textContent='エラー：'+e.message}finally{button.disabled=false}},30)};
$('download').onclick=()=>{if(!result)return;const hdr=['generation','environment','meanFitness','bestFitness','meanGenome','diversity','capacity0','capacity1','capacity2','capacity3'];const lines=[hdr.join(','),...result.history.map(p=>[p.generation,p.environment,p.meanFitness,p.bestFitness,p.meanGenome,p.diversity,...p.meanCapacity].join(','))];const blob=new Blob(['\ufeff'+lines.join('\n')],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='omega-codon-stage1.csv';a.click();URL.revokeObjectURL(url)};
</script></body></html>
