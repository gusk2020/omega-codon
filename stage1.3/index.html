<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>オメガ・コドン Stage 1.3</title>
<style>
:root{color-scheme:dark;--bg:#0e1620;--panel:#172431;--line:#2b4251;--fg:#eef4f5;--muted:#9eb1bd;--accent:#70d3bc}
body{margin:0 auto;max-width:820px;padding:16px;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif}
h1{font-size:1.3rem;margin:.2em 0}.muted{color:var(--muted);font-size:.85rem}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{font-size:.85rem}
input,select{width:100%;box-sizing:border-box;margin-top:3px;background:#0e1821;border:1px solid #456070;color:var(--fg);border-radius:6px;padding:8px;font:inherit}
input[type=checkbox]{width:auto}button{width:100%;padding:12px;border:0;border-radius:8px;background:var(--accent);color:#092820;font-weight:700;font-size:1rem}
canvas{width:100%;height:150px;background:#101c27;border-radius:6px}#stats{line-height:1.6;font-size:.88rem;white-space:pre-line}
</style>
</head>
<body>
<h1>Ω オメガ・コドン Stage 1.3</h1>
<p class="muted">遺伝子制御ネットワーク・行動・細胞記憶の検証画面（最小限）。抽象モデルであり実在生物の予測ではありません。</p>
<section class="panel">
 <div class="fields">
  <label>乱数シード<input id="seed" type="number" value="1"></label>
  <label>ステップ数<input id="steps" type="number" min="1" max="20000" value="2000"></label>
  <label>環境<select id="environment"></select></label>
  <label>外因死亡率<input id="mort" type="number" step="0.005" min="0" max="0.5" value="0.01"></label>
 </div>
 <p><label><input id="selection" type="checkbox" checked> 自然選択</label>
 <label><input id="memory" type="checkbox" checked> 細胞記憶</label>
 <label><input id="switching" type="checkbox" checked> 行動切替</label>
 <label><input id="replacement" type="checkbox" checked> 細胞交換</label>
 <label><input id="regulation" type="checkbox" checked> 遺伝子制御網</label></p>
 <button id="run">実行</button>
 <p class="muted" id="status">未実行</p>
</section>
<section class="panel">
 <div class="muted">個体数</div><canvas id="c-pop" width="760" height="150"></canvas>
 <div class="muted">遺伝的形質（緑=代謝/1.6 橙=捕食 紫=修復）</div><canvas id="c-tr" width="760" height="150"></canvas>
 <div id="stats"></div>
</section>
<script src="engine13.js"></script>
<script>
'use strict';
const $ = (id) => document.getElementById(id);
for (const k of Object.keys(OmegaEngine13.ENVIRONMENTS)) $('environment').add(new Option(k, k));
function plot(id, series, max) {
  const cv = $(id), c = cv.getContext('2d'), w = cv.width, h = cv.height;
  c.clearRect(0, 0, w, h);
  for (const [vals, color] of series) {
    c.strokeStyle = color; c.lineWidth = 2; c.beginPath();
    vals.forEach((v, i) => { const x = 4 + (w - 8) * i / Math.max(1, vals.length - 1), y = h - 6 - (h - 12) * v / max; i ? c.lineTo(x, y) : c.moveTo(x, y); });
    c.stroke();
  }
  c.fillStyle = '#b6c7cf'; c.font = '12px sans-serif'; c.fillText(String(Math.round(max * 100) / 100), 6, 14);
}
const pct = (v) => v == null ? '-' : (v * 100).toFixed(1) + '%';
const num = (v) => v == null ? '-' : v.toFixed(1);
$('run').onclick = () => {
  $('run').disabled = true; $('status').textContent = '計算中…';
  setTimeout(() => {
    try {
      const r = OmegaEngine13.simulate({ seed: +$('seed').value, steps: +$('steps').value, environment: $('environment').value,
        extrinsicMortality: +$('mort').value, selection: $('selection').checked, memory: $('memory').checked,
        switching: $('switching').checked, replacement: $('replacement').checked, regulation: $('regulation').checked });
      const h = r.history;
      plot('c-pop', [[h.map((x) => x.population), '#70d3bc']], Math.max(10, ...h.map((x) => x.population)));
      plot('c-tr', [[h.map((x) => x.loci.metabolism / 1.6), '#70d3bc'], [h.map((x) => x.loci.predation), '#e7b777'], [h.map((x) => x.loci.repairRate), '#ab9eed']], 1);
      const c = Object.entries(r.deathCauses).filter(([, v]) => v).map(([k, v]) => k + ' ' + v).join('、');
      $('stats').textContent =
        `${r.extinct ? '絶滅（' + r.extinctAt + 'ステップ）' : '存続'}／個体数 最小${r.population.min}・中央${r.population.median}・最大${r.population.max}\n` +
        `暦寿命 平均${num(r.lifespan.calendarMean)}・最長${r.lifespan.calendarMax ?? '-'}／能動時間 平均${num(r.lifespan.activeMean)}／内部時間 平均${num(r.lifespan.internalMean)}\n` +
        `行動 ${Object.entries(r.modeFractions).map(([k, v]) => k + ' ' + pct(v)).join('・')}\n` +
        `狩猟成功（狩猟ステップあたり）${pct(r.predation.successPerHuntStep)}／狩猟判断の適合率 ${pct(r.switching.huntPrecision)}\n` +
        `死亡時の元細胞 ${pct(r.cells.originalAtDeath)}／記憶保持率 ${pct(r.cells.memoryRetentionAtDeath)}\n` +
        `遺伝子数 ${num(r.final.meanGenes)}・制御結合 ${num(r.final.meanRegLinks)}・多面発現 ${r.final.meanPleiotropy.toFixed(2)}\n` +
        `死亡原因：${c}`;
      $('status').textContent = `完了 ${r.elapsedMs} ms`;
    } catch (e) { $('status').textContent = 'エラー: ' + e.message; }
    $('run').disabled = false;
  }, 30);
};
</script>
</body>
</html>
